name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build macOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Inspect Xcode
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true
          echo ""
          echo "Selected Xcode:"
          xcode-select -p
          echo ""
          echo "Xcode version:"
          xcodebuild -version
          echo ""
          echo "macOS SDK:"
          xcrun --sdk macosx --show-sdk-version
